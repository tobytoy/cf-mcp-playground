<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#3b82f6" stroke-width="8" stroke-opacity="0.3"/>
  <!-- Glowing Traffic Beacon -->
  <circle cx="256" cy="140" r="48" fill="#f43f5e"/>
  <circle cx="256" cy="256" r="48" fill="#f59e0b"/>
  <circle cx="256" cy="372" r="48" fill="#10b981"/>
  <!-- Outer Navigation Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#accentGrad)" stroke-width="16" stroke-dasharray="24 16"/>
</svg>
